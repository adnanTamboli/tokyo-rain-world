<style>
  :root { --neon:#ff2d95; --cyan:#00e5ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070d; color:#e8ecf4;
    font-family:Inter,system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }

  #intro { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px; background:radial-gradient(ellipse at center, rgba(10,20,40,.15), rgba(10,20,40,.7));
    transition:opacity 1.2s ease, visibility 1.2s; z-index:10; }
  #intro.hide { opacity:0; visibility:hidden; }
  #intro .kanji { font-family:"Noto Sans JP",sans-serif; font-weight:900; font-size:clamp(56px,12vw,120px); line-height:1;
    color:#fff; text-shadow:0 0 12px var(--neon),0 0 40px var(--neon),0 0 80px #ff2d9588; letter-spacing:.08em; }
  #intro h1 { font-weight:300; letter-spacing:.6em; font-size:clamp(14px,2.4vw,20px); margin-right:-.6em; color:#e6f6ff;
    text-shadow:0 0 12px var(--cyan), 0 1px 3px #000; }
  #intro p { font-size:13px; opacity:.8; letter-spacing:.1em; min-height:1.2em; text-shadow:0 1px 3px #000; }
  .enters { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:12px; }
  .enters button { padding:14px 30px; font:500 13px Inter,sans-serif; letter-spacing:.3em; color:#fff;
    background:#0a142866; border:1px solid #ffffff77; border-radius:40px; cursor:pointer; transition:.3s;
    box-shadow:0 0 20px #00e5ff33 inset; backdrop-filter:blur(4px); }
  .enters button:hover:not(:disabled) { border-color:var(--cyan); box-shadow:0 0 24px #00e5ff88, 0 0 20px #00e5ff55 inset; }
  .enters button:disabled { opacity:.3; cursor:wait; }
  .hints { font-size:12px; opacity:.8; line-height:1.9; margin-top:10px; letter-spacing:.05em; text-shadow:0 1px 3px #000; }

  #hud { position:fixed; top:max(14px,env(safe-area-inset-top)); right:14px; display:flex; flex-wrap:wrap; justify-content:flex-end;
    gap:8px; z-index:20; max-width:calc(100vw - 28px); }
  #hud button { background:#0b1020aa; color:#dfe8ff; border:1px solid #ffffff33; border-radius:20px; padding:8px 14px;
    font:500 11px Inter,sans-serif; letter-spacing:.15em; cursor:pointer; backdrop-filter:blur(6px); white-space:nowrap; }
  #seasons { display:flex; background:#0b1020aa; border:1px solid #ffffff33; border-radius:20px; padding:2px; backdrop-filter:blur(6px); }
  #seasons button { border:none; background:none; padding:6px 10px; font-size:14px; letter-spacing:0; border-radius:16px; opacity:.55; }
  #seasons button.on { background:#ffffff26; opacity:1; }
  #snd { display:none; }
  #help { position:fixed; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:11px;
    letter-spacing:.12em; opacity:0; transition:opacity 1.5s; pointer-events:none; white-space:nowrap; color:#fff;
    text-shadow:0 1px 4px #000; z-index:5; }
  #help.show { opacity:.75; }

  /* cinematic letterbox + title cards */
  .bar { position:fixed; left:0; right:0; height:0; background:#000; z-index:4; pointer-events:none;
    transition:height 1.6s cubic-bezier(.6,0,.2,1); }

  body.cine .bar { height:clamp(0px, calc((100vh - 100vw / 2.1) / 2), 11vh); }
  #card { position:fixed; left:50%; bottom:17%; transform:translateX(-50%); text-align:center; opacity:0; z-index:8;
    transition:opacity 1.4s ease; pointer-events:none; color:#fff; text-shadow:0 2px 16px #000a; white-space:nowrap; }
  #card.show { opacity:1; }
  #card .k { font-family:"Noto Serif JP",serif; font-weight:900; font-size:clamp(38px,6.5vw,68px); letter-spacing:.25em; margin-right:-.25em; }
  #card .t { font-weight:300; letter-spacing:.55em; font-size:12px; margin-top:8px; margin-right:-.55em; opacity:.9; }

  #joy { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
    border:1.5px solid #ffffff66; background:radial-gradient(circle, #ffffff18, #ffffff08); pointer-events:none;
    opacity:0; transition:opacity .15s; z-index:6; }
  #joy.on { opacity:1; }
  #knob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
    background:#ffffff44; border:1.5px solid #ffffffcc; box-shadow:0 0 18px #00e5ff66; }
  #fade { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; z-index:15; }
  #fade.on { opacity:1; }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

/* =====================================================================
   CONFIG
   ===================================================================== */
const V3 = THREE.Vector3;
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const LOW = IS_TOUCH;                       // lighter settings on phones
const CHARACTER_URL = './shino.vrm';        // "Sendagaya Shino" — VRoid sample model, CC0
const JP = '"Noto Sans JP","Yu Gothic","Hiragino Sans","Meiryo",sans-serif';

// City layout (metres). Avenues run along Z, cross streets along X.
const AVES = [-70, 0, 70], CROSS = [-124, -62, 0, 62, 124];
const ROAD = 7, WALK = 4, SET = ROAD + WALK;          // half road width, sidewalk width, building setback
const W_MIN = -81, W_MAX = 81, Z_MIN = -135, Z_MAX = 135; // walkable area
const WALK_SPEED = 1.9, RUN_SPEED = 5.6;
const SUN_DIR = new V3();                                              // set per location
const SUN_TOKYO = new V3(0.2, 0.42, -0.88).normalize();                // afternoon sun, straight down the main avenue
const SUN_VILLAGE = new V3(0.72, 0.4, -0.42).normalize();              // side-light Fuji from the right

// Deterministic random so the world is the same every visit
let seed = 20260923;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const lerpAngle = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; };
const lin = (r, g, b) => new THREE.Color().setRGB(r, g, b);   // linear colour
const hex = h => new THREE.Color(h);                           // sRGB hex → linear
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash2 = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm2 = (x, z) => vnoise(x, z) * 0.5 + vnoise(x * 2.1 + 5.2, z * 2.1 + 1.3) * 0.3 + vnoise(x * 4.3 + 9.1, z * 4.3 + 7.7) * 0.2;
const UP = new V3(0, 1, 0);

/* =====================================================================
   RENDERER / SCENE / CAMERA
   ===================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = !LOW;
renderer.shadowMap.type = THREE.PCFShadowMap;           // crisp, cel-style shadows
renderer.shadowMap.autoUpdate = false;                   // updated once per frame (not again inside the mirror pass)
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xffffff, 0.01);
const baseFog = new THREE.Color(), FLASH_FOG = new THREE.Color().setRGB(0.12, 0.16, 0.3);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.2, 320);

const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0x7088c0, 0.35);
moon.position.set(-40, 80, 30);
scene.add(moon);
const sun = new THREE.DirectionalLight(0xfff0da, 3);
sun.castShadow = !LOW;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 320 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

// The two locations live in their own groups; only one is visible at a time
const tokyo = new THREE.Group(), village = new THREE.Group();
scene.add(tokyo, village);

// Snow cover: any material passed through snowy() turns white on upward-facing surfaces when SNOW > 0
const SNOW = { value: 0 }, SNOW_COL = { value: lin(0.86, 0.9, 0.98) };
function snowy(mat, k = 1) {
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (s, r) => {
    prev.call(mat, s, r);
    s.uniforms.uSnow = SNOW; s.uniforms.uSnowCol = SNOW_COL;
    s.fragmentShader = 'uniform float uSnow; uniform vec3 uSnowCol;\n' + s.fragmentShader.replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      { vec3 upV = normalize((viewMatrix*vec4(0.,1.,0.,0.)).xyz);
        float sm = smoothstep(0.42, 0.78, dot(normal, upV)) * ${k.toFixed(2)};
        diffuseColor.rgb = mix(diffuseColor.rgb, uSnowCol, uSnow*sm); }`);
  };
  const key = 'snowy' + k + prev.toString();
  mat.customProgramCacheKey = () => key;
  return mat;
}

// 3-step ramp → anime cel shading
const toonRamp = new THREE.DataTexture(new Uint8Array([105, 105, 105, 255, 185, 185, 185, 255, 255, 255, 255, 255]), 3, 1);
toonRamp.minFilter = toonRamp.magFilter = THREE.NearestFilter; toonRamp.needsUpdate = true;
const toon = (params, snowK = 1) => { const m = new THREE.MeshToonMaterial({ gradientMap: toonRamp, ...params }); return snowK ? snowy(m, snowK) : m; };

/* =====================================================================
   SKY: painted gradient, cel-shaded clouds, sun, rainbow, stars + moon
   ===================================================================== */
const skyGroup = new THREE.Group(); scene.add(skyGroup);   // follows the camera: sky dome + Mount Fuji backdrop
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }, uSunDir: { value: SUN_DIR }, uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
    uCloudLit: { value: new THREE.Color() }, uCloudShadow: { value: new THREE.Color() }, uSun: { value: 1 }, uRainbow: { value: 0 }, uCover: { value: 0.5 },
    uStars: { value: 0 }, uMoonDir: { value: new V3(-0.35, 0.5, -0.8).normalize() },
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform float uTime, uSun, uRainbow, uCover, uStars; uniform vec3 uSunDir, uTop, uHor, uCloudLit, uCloudShadow, uMoonDir; varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<6;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 col = mix(uHor, uTop, pow(clamp(h,0.,1.), 0.5));
      float sd = max(dot(d, uSunDir), 0.);
      col += uSun*(vec3(1.,.93,.8)*pow(sd,900.)*14. + vec3(1.,.86,.62)*pow(sd,10.)*.45);
      if (uStars > 0. && h > 0.) {                                  // clear-night stars and moon
        vec3 s3 = d*260.; vec3 cell = floor(s3);
        float r = fract(sin(dot(cell, vec3(12.9898,78.233,37.719)))*43758.5453);
        float star = step(0.9975, r)*smoothstep(0.5, 0.1, length(fract(s3)-.5))*(0.5+0.5*sin(uTime*2.+r*90.));
        col += uStars*star*vec3(.9,.95,1.)*2.*smoothstep(0.,.2,h);
        float md = dot(d, uMoonDir);
        col += uStars*(vec3(1.,.96,.86)*smoothstep(0.99955,0.9997,md)*4. + vec3(.35,.42,.6)*pow(max(md,0.),60.)*.35);
      }
      float ang = degrees(acos(clamp(dot(d, -uSunDir), -1., 1.)));  // rainbow opposite the sun (sun-shower)
      float rb = smoothstep(39.6, 40.6, ang)*(1.-smoothstep(42.4, 43.4, ang));
      vec3 rbc = 0.55 + 0.45*cos(6.2831*(clamp((ang-40.)/3.4,0.,1.)*0.8 + vec3(0.67,0.33,0.0)));
      col = mix(col, col + rbc*0.6, rb*uRainbow*smoothstep(0.,.08,h));
      if (h > 0.) {
        vec2 uv = d.xz/(h+0.12)*0.75 + vec2(uTime*0.006, uTime*0.003);
        float c = fbm(uv);
        float cov = smoothstep(uCover, uCover+0.07, c);
        float lit = clamp((c - fbm(uv + uSunDir.xz*0.09))*7. + 0.55, 0., 1.);
        lit = floor(lit*3.)/2.;                                   // toon bands in the clouds
        vec3 cc = mix(uCloudShadow, uCloudLit, clamp(lit,0.,1.));
        cc += uSun*vec3(1.,.85,.6)*pow(sd,6.)*.5;                 // golden rim near the sun
        col = mix(col, cc, cov*smoothstep(0.,.12,h));
      }
      gl_FragColor = vec4(col, 1.);
    }`,
  side: THREE.BackSide, depthWrite: false, fog: false,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(280, 48, 24), skyMat);
sky.renderOrder = -2; sky.frustumCulled = false; skyGroup.add(sky);

/* =====================================================================
   MOUNT FUJI — a painted backdrop drawn right after the sky (no depth), so every
   hill, house and the lake draw over its foot and it reads as infinitely far away
   ===================================================================== */
const fujiMat = new THREE.ShaderMaterial({
  uniforms: {
    uSunDir: { value: SUN_DIR }, uSunCol: { value: new THREE.Color() }, uAmb: { value: new THREE.Color() }, uHaze: { value: new THREE.Color() },
    uRock1: { value: new THREE.Color() }, uRock2: { value: new THREE.Color() }, uSnowLit: { value: new THREE.Color() }, uSnowShade: { value: new THREE.Color() },
    uSnowLine: { value: 60 }, uHazeK: { value: 0.4 },
  },
  vertexShader: `varying vec3 vL, vN; void main(){ vL = position; vN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 uSunDir, uSunCol, uAmb, uHaze, uRock1, uRock2, uSnowLit, uSnowShade; uniform float uSnowLine, uHazeK; varying vec3 vL, vN;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    void main(){
      float a = atan(vL.z, vL.x);
      float g = sin(a*46. + sin(a*9.)*2.5)*0.5 + 0.5;              // erosion gullies
      float n = noise(vec2(a*16., vL.y*0.07)) ;
      float line = uSnowLine - pow(g, 3.)*22. - n*9.;               // jagged snow fingers down the gullies
      float snow = step(line, vL.y);
      float l = dot(normalize(vN), uSunDir);
      float lit = smoothstep(0.02, 0.1, l);                        // hard anime light/shadow split
      vec3 rock = mix(uRock1, uRock2, n)*(0.88 + 0.12*g);
      vec3 col = snow > .5 ? mix(uSnowShade, uSnowLit, lit) : rock*(uAmb + uSunCol*lit);
      float haze = uHazeK*(1. - smoothstep(-20., 95., vL.y)*0.65);
      gl_FragColor = vec4(mix(col, uHaze, clamp(haze, 0., 1.)), 1.);
    }`,
  depthWrite: false, fog: false,
});
const fuji = (() => {
  const R = 190, H = 86, RINGS = 46, SEG = 176, pos = [], idx = [];
  for (let i = 0; i <= RINGS; i++) {
    const u = i / RINGS;
    for (let j = 0; j <= SEG; j++) {
      const a = j / SEG * Math.PI * 2;
      let r, y;
      if (i === 0) { r = R * 0.02; y = H * 0.915; }                                   // crater floor
      else {
        const uu = 0.03 + 0.97 * Math.pow(u, 1.15);
        r = R * uu * (1 + 0.035 * Math.sin(a * 3 + 1) + 0.02 * Math.sin(a * 7 + 2));
        y = H * Math.pow(1 - uu, 1.45) + H * 0.012 * Math.sin(a * 41 + Math.sin(a * 9) * 2) * Math.sin(uu * Math.PI);
        if (i === 1) y += 0.8;                                                          // crater rim
      }
      pos.push(Math.cos(a) * r, y, Math.sin(a) * r);
    }
  }
  for (let i = 0; i < RINGS; i++) for (let j = 0; j < SEG; j++) {
    const A = i * (SEG + 1) + j, B = A + 1, C = A + SEG + 1, D = C + 1;
    idx.push(A, B, C, B, D, C);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, fujiMat); m.position.set(-10, -33, -265); m.renderOrder = -1; m.frustumCulled = false;
  skyGroup.add(m); return m;
})();

/* =====================================================================
   TEXTURE HELPERS (everything is generated — no image files needed)
   ===================================================================== */
function canvasTex(w, h, draw, { repeat = false, data = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  return t;
}

const NEON = ['#ff2d95', '#00e5ff', '#ffb000', '#7cff4f', '#b04dff', '#ff3b3b', '#29a3ff', '#ffe600'];
const V_WORDS = ['ラーメン', '居酒屋', 'カラオケ', 'ホテル', '寿司', '薬局', '喫茶店', '焼肉', '酒場', '東京', '夜市', '漫画', '古着', 'うどん', '雨宿り', '中華'];
const H_WORDS = ['BAR', 'RAMEN', 'コンビニ', '24H', 'CAFE', 'KARAOKE', 'HOTEL', 'SUSHI', '居酒屋', 'GAME', 'ネオン', 'NOODLE'];

function vSign(word, color, box) {
  return canvasTex(128, 512, (g, w, h) => {
    if (box) { g.fillStyle = '#f3efe4'; g.fillRect(0, 0, w, h); g.fillStyle = color; g.fillRect(0, 0, w, 18); g.fillRect(0, h - 18, w, 18); }
    else {
      g.fillStyle = '#07070c'; g.fillRect(0, 0, w, h);
      g.strokeStyle = color; g.lineWidth = 6; g.shadowColor = color; g.shadowBlur = 18; g.strokeRect(12, 12, w - 24, h - 24);
    }

   ===================================================================== */
// Merge everything by material → a handful of draw calls per location
function addMerged(list, mat, shadows, group = tokyo) {
  if (!list.length) return null;
  const same = list.some(g => !g.index) ? list.map(g => g.index ? g.toNonIndexed() : g) : list;
  const m = new THREE.Mesh(mergeGeometries(same), mat);
  if (shadows) m.castShadow = m.receiveShadow = true;
  group.add(m); return m;
}
const faceAngle = n => Math.atan2(n.x, n.z);
function plane(w, h, center, normal) { const p = new THREE.PlaneGeometry(w, h); p.rotateY(faceAngle(normal)); p.translate(center.x, center.y, center.z); return p; }

// Box with world-scaled UVs so a wall texture tiles correctly on every building size
function buildingBox(sx, sy, sz, off, T = 12, offZ = off) {
  const g = new THREE.BoxGeometry(sx, sy, sz), p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i) + sy / 2, z = p.getZ(i);
    if (Math.abs(n.getY(i)) > 0.5) uv.setXY(i, 0.004, 0.996);
    else if (Math.abs(n.getX(i)) > 0.5) uv.setXY(i, (z + offZ) / T, y / T);

}

   TREES (sakura / maple / pine) — foliage colour follows the season
   ===================================================================== */
const barkMat = toon({ color: 0x5b4334 });

const TREES = { tokyo: treeGeo(), village: treeGeo() };
function addTree(L, kind, x, y, z, s = 1) {
  const T = TREES[L];
  if (kind === 'pine') {
    const tr = new THREE.CylinderGeometry(0.12 * s, 0.22 * s, 2.4 * s, 6); tr.translate(x, y + 1.2 * s, z); T.trunk.push(tr);
    for (let k = 0; k < 3; k++) { const c = new THREE.ConeGeometry((2.0 - k * 0.52) * s, (2.6 - k * 0.35) * s, 8); c.rotateY(rand() * 3); c.translate(x, y + (2.3 + k * 1.3) * s, z); T.pine.push(c); }
    return;
  }
  const h = (kind === 'sakura' ? 2.0 : 2.6) * s, lean = rr(-0.07, 0.07);
  const tr = new THREE.CylinderGeometry(0.13 * s, 0.25 * s, h, 7); tr.translate(0, h / 2, 0); tr.rotateZ(lean); tr.translate(x, y, z); T.trunk.push(tr);
  const top = new V3(x - Math.sin(lean) * h, y + h * Math.cos(lean), z);
  const n = 5, a0 = rand() * 6.3;
  for (let b = 0; b < n; b++) {
    const ang = a0 + b / n * Math.PI * 2 + rr(-0.3, 0.3), tilt = kind === 'sakura' ? rr(0.85, 1.15) : rr(0.55, 0.85), len = rr(1.4, 2.0) * s;
    const br = new THREE.CylinderGeometry(0.045 * s, 0.1 * s, len, 5); br.translate(0, len / 2, 0); br.rotateZ(-tilt); br.rotateY(ang); br.translate(top.x, top.y - 0.25 * s, top.z);
    T.trunk.push(br);
    const tip = new V3(Math.sin(tilt) * len * Math.cos(ang), Math.cos(tilt) * len, -Math.sin(tilt) * len * Math.sin(ang)).add(top);
    for (let k = 0; k < 2; k++) {
      const r = rr(0.9, 1.35) * s * (k ? 0.8 : 1), blob = new THREE.IcosahedronGeometry(r, 1);
      blob.scale(1, kind === 'sakura' ? 0.62 : 0.82, 1);

// Decorate one street-facing wall: shopfront, signs, vending machines
function decorate(O, dir, N, w, h, noBladeAbove = 99) {
  const at = (t, y, out) => O.clone().addScaledVector(dir, t).addScaledVector(N, out).setY(y);
  if (w > 3 && rand() < 0.85) {
    const k = Math.floor(rand() * 3);
    geo.shop[k].push(plane(Math.min(w * rr(0.55, 0.85), 12), 2.6, at(w / 2, 1.45, 0.05), N));
    lightSources.push({ p: at(w / 2, 2.6, 1.8), c: new THREE.Color(k === 0 ? 0xdff0ff : k === 1 ? 0xffb060 : 0xc050ff), i: 14 });
  }
  if (w > 4 && rand() < 0.6) { const k = Math.floor(rand() * hMats.length); geo.h[k].push(plane(Math.min(w * 0.6, 5.5), 1.2, at(w / 2, 3.55, 0.1), N)); }
  if (w > 5 && h > 14 && rand() < 0.3) {   // stacked wall signs (Kabukicho style)
    const n = 2 + Math.floor(rand() * 3), sw = Math.min(w * 0.45, 4.5), t = rand() < 0.5 ? sw / 2 + 0.3 : w - sw / 2 - 0.3;
    for (let i = 0; i < n; i++) { const k = Math.floor(rand() * hMats.length); if (5.6 + i * 1.5 + 1 < noBladeAbove) geo.h[k].push(plane(sw, 1.15, at(t, 5.6 + i * 1.5, 0.1), N)); }
  }

    if (base + sh > Math.min(h - 0.5, noBladeAbove)) continue;
    const k = Math.floor(rand() * vMats.length), t = b === 0 ? rr(0.6, 1.2) : w - rr(0.6, 1.2);
    const c = at(t, base + sh / 2, 0.8);
    geo.v[k].push(plane(1.15, sh, c, dir), plane(1.15, sh, c, dir.clone().negate()));
    lightSources.push({ p: at(t, base + sh / 2, 2.2), c: vMats[k].userData.col, i: 30 });
  }

// Fill one side of a block with a row of buildings
function fillRow(P0, D, N, length, depth, sides) {
  const along = p => new V3().subVectors(p, P0).dot(D);
  const rowScreens = screens.filter(s => Math.abs(new V3().subVectors(s.pos, P0).dot(N)) < 0.3 && s.n.dot(N) > 0.9);
  let s = 0, first = true;
  while (s < length - 0.5) {
    let w = rr(7, 14); if (length - (s + w) < 5) w = length - s;
    let h = rand() < 0.14 ? rr(48, 85) : rr(12, 38), setback = rand() < 0.3 ? rr(0.2, 0.9) : 0, bladeCap = 99;
    for (const sc of rowScreens) {
      const a = along(sc.pos);
      if (a + sc.w / 2 > s && a - sc.w / 2 < s + w) { h = Math.max(h, sc.pos.y + sc.h / 2 + 5); setback = 0; bladeCap = sc.pos.y - sc.h / 2 - 0.5; }
    }
    const d = depth - setback, style = Math.floor(rand() * facadeNightMats.length);
    const front = P0.clone().addScaledVector(D, s).addScaledVector(N, -setback);
    const center = P0.clone().addScaledVector(D, s + w / 2).addScaledVector(N, -(setback + d / 2));
    const alongX = Math.abs(D.x) > 0.5, sx = alongX ? w : d, sz = alongX ? d : w;
    const g = buildingBox(sx, h, sz, rand() * 12); g.translate(center.x, h / 2, center.z); geo.build[style].push(g);

    // roof clutter + aviation lights
    for (let i = 0, n = Math.floor(rand() * 4); i < n; i++) {
      const b = new THREE.BoxGeometry(rr(1, 3), rr(0.8, 2.2), rr(1, 3));
      b.translate(center.x + rr(-sx, sx) * 0.35, h + 0.6, center.z + rr(-sz, sz) * 0.35); geo.roof.push(b);
    }
    if (h > 45) for (const sgn of [-1, 1]) { const a = new THREE.SphereGeometry(0.35, 8, 6); a.translate(center.x + sgn * sx * 0.4, h + 0.4, center.z + sgn * sz * 0.4); geo.avi.push(a); }

    decorate(front, D, N, w, h, bladeCap);
    if (sides && first) decorate(front.clone(), N.clone().negate(), D.clone().negate(), d, h);   // exposed side facing cross street
    s += w; first = false;
    if (sides && s >= length - 0.5) decorate(front.clone().addScaledVector(D, w).addScaledVector(N, -d), N.clone(), D.clone(), d, h);
  }
}

  fu.uSnowLine.value = S.snowLine; fu.uHaze.value.copy(fog); fu.uHazeK.value = isDay ? S.hazeK : 0.35;
  if (isDay) {
    fu.uSunCol.value.copy(lin(0.85, 0.8, 0.7).multiplyScalar(S.sunK)); fu.uAmb.value.copy(lin(0.45, 0.52, 0.72));
    fu.uRock1.value.copy(lin(0.1, 0.13, 0.28)); fu.uRock2.value.copy(lin(0.16, 0.19, 0.36));
    fu.uSnowLit.value.copy(lin(0.96, 0.97, 1.0)); fu.uSnowShade.value.copy(lin(0.46, 0.56, 0.84));
  } else {
    fu.uSunCol.value.copy(lin(0.05, 0.07, 0.12)); fu.uAmb.value.copy(lin(0.05, 0.06, 0.1));
    fu.uRock1.value.copy(lin(0.02, 0.025, 0.05)); fu.uRock2.value.copy(lin(0.03, 0.035, 0.07));
    fu.uSnowLit.value.copy(lin(0.2, 0.25, 0.4)); fu.uSnowShade.value.copy(lin(0.1, 0.13, 0.24));
  }
  // seasonal foliage, snow, ground colours
  SNOW.value = season === 'winter' ? 1 : 0;
  for (const [mat, key] of [[sakuraMat, 'sakura'], [mapleMat, 'maple']]) {
    if (S[key]) mat.color.set(S[key]);
    for (const l of ['tokyo', 'village']) if (foliage[l][key]) foliage[l][key].visible = !!S[key];
  }
  if (paintedFor !== season) { paintTerrain(season); paintedFor = season; }
  // precipitation
  rain.visible = wet; ripples.visible = wet;
  rainMat.uniforms.uColor.value.copy(M.rainCol); rainMat.uniforms.uAlpha.value = M.rainA;
  rainMat.blending = M.rainAdd ? THREE.AdditiveBlending : THREE.NormalBlending; rainMat.needsUpdate = true;
  flurry.visible = !!S.fall;
  if (S.fall) {
    const F = S.fall, fu2 = flMat.uniforms;
    flGeo.instanceCount = Math.floor(FLURRY * F.n);
    fu2.uShape.value = F.shape; fu2.uSize.value = F.size; fu2.uFall.value = F.speed; fu2.uSway.value = F.sway; fu2.uWind.value.set(...F.wind);
    fu2.uC1.value.set(F.c[0]); fu2.uC2.value.set(F.c[1]); fu2.uC3.value.set(F.c[2]);
    fu2.uLight.value = isDay ? 1.05 : (F.shape === 2 ? 0.55 : 0.35);
  }
  // post
  ink.uniforms.uOutline.value = M.outline; ink.uniforms.uLineColor.value.copy(M.line);
  grade.uniforms.uDay.value = isDay ? 1 : 0;
  grade.uniforms.uTint.value.set(...(isDay ? S.tint : [1, 1, 1]));
  if (isDay) resetPool();
  modeBtn.textContent = isDay ? '☾ NIGHT' : '☀ DAY';
  locBtn.textContent = V ? '🏙 TOKYO' : '🗻 FUJI VILLAGE';
  document.querySelectorAll('#seasons button').forEach(b => b.classList.toggle('on', b.dataset.s === season));
  setAmbience();
}
let paintedFor = null;

const modeBtn = document.getElementById('mode'), locBtn = document.getElementById('loc');
const fadeEl = document.getElementById('fade'), cardEl = document.getElementById('card');
let cardTimer = 0;
function showCard() {
  if (!started) return;
  const S = SEASONS[season];
  cardEl.querySelector('.k').textContent = (loc === 'village' ? '富士' : '東京') + '・' + S.kanji;
  cardEl.querySelector('.t').textContent = `${L().name} — ${S.name}${isDay ? '' : ' · NIGHT'}`;
  cardEl.classList.add('show'); clearTimeout(cardTimer); cardTimer = setTimeout(() => cardEl.classList.remove('show'), 3200);
}
function transition(color, fn) {
  fadeEl.style.background = color; fadeEl.classList.add('on');
  setTimeout(() => { fn(); applyMode(); fadeEl.classList.remove('on'); showCard(); }, 360);
}
function toggleMode() { transition(isDay ? '#05070d' : '#ffffff', () => { isDay = !isDay; }); }
function setSeason(s) { if (s !== season) transition('#ffffff', () => { season = s; }); }
function setLocation(name) {
  loc = name; const D = LOCS[name];
  tokyo.visible = name === 'tokyo'; village.visible = name === 'village'; fuji.visible = name === 'village';
  SUN_DIR.copy(D.sun);
  player.pos.copy(D.spawn); player.pos.y = D.groundY(D.spawn.x, D.spawn.z); player.heading = D.heading; player.speed = 0;
  cam.yaw = D.heading - Math.PI; cam.pitch = 0.14;
  camTarget.copy(player.pos).setY(player.pos.y + CAM_H);
  camera.position.set(player.pos.x, player.pos.y + 3, player.pos.z + 6);
  resetPool();
}
function switchLocation() { transition('#ffffff', () => setLocation(loc === 'tokyo' ? 'village' : 'tokyo')); }
modeBtn.onclick = toggleMode;
locBtn.onclick = switchLocation;
document.querySelectorAll('#seasons button').forEach(b => b.onclick = () => setSeason(b.dataset.s));

/* =====================================================================
   UI
   ===================================================================== */
const statusEl = document.getElementById('status'), enterBtn = document.getElementById('enter'), enter2Btn = document.getElementById('enter2');
function status(t) { statusEl.textContent = t; }
document.getElementById('hints').innerHTML = IS_TOUCH
  ? 'LEFT THUMB — drag to walk (push far to run)<br>RIGHT THUMB — swipe to look around · buttons above: place, season, day/night'
  : 'WASD — walk · SHIFT — run · CLICK + MOVE MOUSE — look · SCROLL — zoom<br>1–4 — season · N — day / night · V — Tokyo ⇄ Fuji village · C — cinema bars · GAMEPAD';
document.getElementById('help').textContent = IS_TOUCH ? 'LEFT: MOVE · RIGHT: LOOK' : 'CLICK + MOVE MOUSE TO LOOK · WASD MOVE · 1–4 SEASON · N NIGHT · V TRAVEL';
let started = false;
function start(where) {
  if (where !== loc) setLocation(where);
  applyMode();
  started = true;
  document.getElementById('intro').classList.add('hide');
  document.getElementById('snd').style.display = 'block';
  document.getElementById('help').classList.add('show');
  document.body.classList.add('cine');
  setTimeout(() => document.getElementById('help').classList.remove('show'), 9000);
  startAudio(); canvas.focus(); nextPhrase = now + 3;
  setTimeout(showCard, 900);
  if (IS_TOUCH && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
enterBtn.onclick = () => start('tokyo');
enter2Btn.onclick = () => start('village');
status('Loading character…');
charReady.then(() => { status(''); enterBtn.disabled = enter2Btn.disabled = false; });

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
const clock = new THREE.Clock();
const camTarget = player.pos.clone().add(new V3(0, 1.35, 0));
const desired = new V3(), tmp = new V3(), sunProj = new V3(), camFwd = new V3();
setLocation('tokyo');
applyMode();
window.__app = { THREE, scene, camera, renderer, composer, player, cam, mirror, lake, ground, toggleMode, setSeason, setLocation: n => transition('#fff', () => setLocation(n)), get vrm() { return vrm; } };   // handy for debugging in DevTools
let poolTimer = 0, nextBolt = 7, flash = 0, flicker = 0, frame = 0, sunVis = 0;

function update(dt, t) {
  const D = L();
  // ---- movement ----
  const inp = started ? readInput(dt) : { x: 0, y: 0, run: false, analog: false };
  const mag = Math.min(1, Math.hypot(inp.x, inp.y));
  const fwd = tmp.set(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
  const dirX = fwd.x * inp.y + Math.cos(cam.yaw) * inp.x, dirZ = fwd.z * inp.y - Math.sin(cam.yaw) * inp.x;
  const moving = mag > 0.08;
  const target = moving ? (inp.run ? RUN_SPEED : WALK_SPEED) * (inp.analog && !inp.run ? clamp(mag * 1.25, 0.4, 1) : 1) : 0;
  player.speed = damp(player.speed, target, moving ? 6 : 10, dt);
  if (moving) player.heading = lerpAngle(player.heading, Math.atan2(dirX, dirZ), 1 - Math.exp(-dt * 10));
  const ox = player.pos.x, oz = player.pos.z;
  player.pos.x += Math.sin(player.heading) * player.speed * dt;
  player.pos.z += Math.cos(player.heading) * player.speed * dt;
  if (D.walkable && !D.walkable(player.pos.x, player.pos.z)) {          // keep out of the lake (slide along the shore)
    if (D.walkable(player.pos.x, oz)) player.pos.z = oz;
    else if (D.walkable(ox, player.pos.z)) player.pos.x = ox;
    else { player.pos.x = ox; player.pos.z = oz; }
  }
  collide(player.pos, 0.35);
  player.pos.y = damp(player.pos.y, D.groundY(player.pos.x, player.pos.z), 14, dt);
  charRoot.position.copy(player.pos); charRoot.rotation.y = player.heading;

  // camera swings behind the player while walking (forward or sideways) unless the player is steering the view
  if (moving && inp.y > -0.3 && now - cam.lastLook > 0.8) {
    const rate = 2.2 * Math.max(0, inp.y / mag) + 0.9 * Math.abs(inp.x / mag);
    cam.yaw = lerpAngle(cam.yaw, player.heading + Math.PI, 1 - Math.exp(-dt * rate));
  }
  if (!started) cam.yaw = Math.sin(t * 0.08) * 0.35;

  // ---- character animation ----
  const s = player.speed;
  if (vrm) animateChar(dt, t, s);
  else if (fallback) {
    fallback.t += dt * (2 + s * 2.2); const sw = Math.sin(fallback.t) * Math.min(1, s / 2) * 0.7;
    fallback.legs[0].rotation.x = sw; fallback.legs[1].rotation.x = -sw; fallback.arms[0].rotation.x = -sw; fallback.arms[1].rotation.x = sw;
  }

  // ---- camera ----
  camTarget.lerp(tmp.copy(player.pos).setY(player.pos.y + CAM_H), 1 - Math.exp(-dt * 10));
  const cp = Math.cos(cam.pitch);
  desired.set(camTarget.x + Math.sin(cam.yaw) * cp * cam.dist, camTarget.y + Math.sin(cam.pitch) * cam.dist, camTarget.z + Math.cos(cam.yaw) * cp * cam.dist);
  desired.y += Math.sin(t * 1.3) * 0.04 + Math.abs(Math.sin(t * 5.5)) * Math.min(1, s / 4) * 0.05;   // handheld sway + footstep bob
  collide(desired, 0.3); desired.y = Math.max(D.groundY(desired.x, desired.z) + 0.4, desired.y);
  camera.position.lerp(desired, 1 - Math.exp(-dt * 12));
  camera.lookAt(camTarget);
  keyLight.position.copy(player.pos).lerp(camera.position, 0.35).setY(player.pos.y + 2.8);
  skyGroup.position.copy(camera.position);

  // ---- sun, shadows, lens flare ----
  sun.position.copy(player.pos).addScaledVector(SUN_DIR, 150); sun.target.position.copy(player.pos);
  if (renderer.shadowMap.enabled) renderer.shadowMap.needsUpdate = isDay;
  sunProj.copy(camera.position).addScaledVector(SUN_DIR, 250).project(camera);
  const facing = camera.getWorldDirection(camFwd).dot(SUN_DIR) > 0.2;
  sunVis = damp(sunVis, isDay && season !== 'winter' && facing && Math.abs(sunProj.x) < 1.2 && Math.abs(sunProj.y) < 1.2 ? 1 : 0, 6, dt);
  ink.uniforms.uSunUV.value.set(sunProj.x * 0.5 + 0.5, sunProj.y * 0.5 + 0.5); ink.uniforms.uSunVis.value = sunVis;
  skyMat.uniforms.uTime.value = t;

  // ---- weather ----
  rainMat.uniforms.uTime.value = t % 1000; rainMat.uniforms.uCenter.value.copy(camera.position);
  ripMat.uniforms.uTime.value = t; ripMat.uniforms.uCenter.value.copy(player.pos);
  flMat.uniforms.uTime.value = t % 1000; flMat.uniforms.uCenter.value.copy(camera.position);
  lake.material.uniforms.uTime.value = t;
  boat.position.y = 0.12 + Math.sin(t * 0.9) * 0.05; boat.rotation.z = Math.sin(t * 0.7) * 0.04; boat.rotation.x = Math.sin(t * 0.5) * 0.02;

  // ---- pooled lights (night only) ----
  if (!isDay) {
    if ((poolTimer -= dt) <= 0) { poolTimer = 0.25; updatePool(player.pos, D.lights); }
    for (const l of pool) { const src = l.userData.src; if (src) l.color.copy(src.c); l.intensity = damp(l.intensity, src ? src.i : 0, 4, dt); }
  }

  // ---- Tokyo only: video screens, flickering neon, aviation lights ----
  if (loc === 'tokyo') {
    if (frame++ % 2 === 0) screenCanvases.forEach((c, v) => {
      const hue = drawScreen(c.getContext('2d'), c.width, c.height, t, v); screenTex[v].needsUpdate = true;
      for (const sl of screenLights) if (sl.v === v) sl.c.setHSL(hue / 360, 0.85, 0.55);
    });
    flicker -= dt; if (flicker < -rr(2, 6)) flicker = rr(0.2, 0.6);
    if (!isDay) vMats[3].color.setScalar(flicker > 0 && Math.random() < 0.5 ? 0.15 : MODES.night.signNeon);
    aviMat.color.setRGB(Math.sin(t * 3) > 0.3 ? 4 : 0.15, 0, 0);
  }

  // ---- lightning (rainy nights) ----
  if (!isDay && season === 'rainy' && t > nextBolt) {
    nextBolt = t + rr(9, 22); flash = 1;
    const dist = Math.random(); setTimeout(() => thunder(dist), 500 + dist * 2200);
  }
  flash = Math.max(0, flash - dt * 2.2);
  const f = flash > 0 ? flash * (0.55 + 0.45 * Math.sin(t * 70)) * (flash > 0.55 || flash < 0.35 ? 1 : 0.25) : 0;
  const M = isDay ? MODES.day : MODES.night;
  hemi.intensity = M.hemi[2] + f * 7; moon.intensity = M.moonI + f * 5;
  scene.fog.color.copy(baseFog).lerp(FLASH_FOG, f * 0.7); skyMat.uniforms.uHor.value.copy(scene.fog.color);
  rainMat.uniforms.uFlash.value = f * 0.6; grade.uniforms.uFlash.value = f * 0.4; grade.uniforms.uTime.value = t;
  audioTick(t);
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  now = clock.elapsedTime;
  update(dt, now);
  composer.render();
});
</script>
</body>
