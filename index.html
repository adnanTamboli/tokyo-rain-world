<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tokyo Rain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root { --neon:#ff2d95; --cyan:#00e5ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070d; color:#e8ecf4;
    font-family:Inter,system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }

  #intro { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px; background:radial-gradient(ellipse at center, rgba(10,20,40,.15), rgba(10,20,40,.7));
    transition:opacity 1.2s ease, visibility 1.2s; z-index:10; }
  #intro.hide { opacity:0; visibility:hidden; }
  #intro .kanji { font-family:"Noto Sans JP",sans-serif; font-weight:900; font-size:clamp(56px,12vw,120px); line-height:1;
    color:#fff; text-shadow:0 0 12px var(--neon),0 0 40px var(--neon),0 0 80px #ff2d9588; letter-spacing:.08em; }
  #intro h1 { font-weight:300; letter-spacing:.6em; font-size:clamp(14px,2.4vw,20px); margin-right:-.6em; color:#e6f6ff;
    text-shadow:0 0 12px var(--cyan), 0 1px 3px #000; }
  #intro p { font-size:13px; opacity:.8; letter-spacing:.1em; min-height:1.2em; text-shadow:0 1px 3px #000; }
  #enter { margin-top:12px; padding:14px 34px; font:500 14px Inter,sans-serif; letter-spacing:.3em; color:#fff;
    background:#0a142866; border:1px solid #ffffff77; border-radius:40px; cursor:pointer; transition:.3s;
    box-shadow:0 0 20px #00e5ff33 inset; backdrop-filter:blur(4px); }
  #enter:hover:not(:disabled) { border-color:var(--cyan); box-shadow:0 0 24px #00e5ff88, 0 0 20px #00e5ff55 inset; }
  #enter:disabled { opacity:.3; cursor:wait; }
  .hints { font-size:12px; opacity:.8; line-height:1.9; margin-top:10px; letter-spacing:.05em; text-shadow:0 1px 3px #000; }

  #hud { position:fixed; top:max(14px,env(safe-area-inset-top)); right:14px; display:flex; gap:8px; z-index:20; }
  #hud button { background:#0b1020aa; color:#dfe8ff; border:1px solid #ffffff33; border-radius:20px; padding:8px 14px;
    font:500 11px Inter,sans-serif; letter-spacing:.15em; cursor:pointer; backdrop-filter:blur(6px); }
  #snd { display:none; }
  #help { position:fixed; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:11px;
    letter-spacing:.12em; opacity:0; transition:opacity 1.5s; pointer-events:none; white-space:nowrap; color:#fff;
    text-shadow:0 1px 4px #000; z-index:5; }
  #help.show { opacity:.75; }

  #joy { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
    border:1.5px solid #ffffff66; background:radial-gradient(circle, #ffffff18, #ffffff08); pointer-events:none;
    opacity:0; transition:opacity .15s; z-index:6; }
  #joy.on { opacity:1; }
  #knob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
    background:#ffffff44; border:1.5px solid #ffffffcc; box-shadow:0 0 18px #00e5ff66; }
  #fade { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; z-index:15; }
  #fade.on { opacity:1; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="intro">
  <div class="kanji">東京・雨</div>
  <h1>TOKYO RAIN</h1>
  <p id="status">Building the city…</p>
  <button id="enter" disabled>ENTER</button>
  <div class="hints" id="hints"></div>
</div>
<div id="hud"><button id="mode">☾ NIGHT</button><button id="snd">SOUND ON</button></div>
<div id="help"></div>
<div id="joy"><div id="knob"></div></div>
<div id="fade"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   CONFIG
   ===================================================================== */
const V3 = THREE.Vector3;
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const LOW = IS_TOUCH;                       // lighter settings on phones
const CHARACTER_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/Soldier.glb';
const JP = '"Noto Sans JP","Yu Gothic","Hiragino Sans","Meiryo",sans-serif';

// City layout (metres). Avenues run along Z, cross streets along X.
const AVES = [-70, 0, 70], CROSS = [-124, -62, 0, 62, 124];
const ROAD = 7, WALK = 4, SET = ROAD + WALK;          // half road width, sidewalk width, building setback
const W_MIN = -81, W_MAX = 81, Z_MIN = -135, Z_MAX = 135; // walkable area
const WALK_SPEED = 1.9, RUN_SPEED = 5.6;
const SUN_DIR = new V3(0.2, 0.42, -0.88).normalize();  // afternoon sun, straight down the main avenue

// Deterministic random so the city is the same every visit
let seed = 20260923;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const lerpAngle = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; };
const lin = (r, g, b) => new THREE.Color().setRGB(r, g, b);   // linear colour

/* =====================================================================
   RENDERER / SCENE / CAMERA
   ===================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = !LOW;
renderer.shadowMap.type = THREE.PCFShadowMap;           // crisp, cel-style shadows
renderer.shadowMap.autoUpdate = false;                   // updated once per frame (not again inside the mirror pass)
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xffffff, 0.01);
const baseFog = new THREE.Color(), FLASH_FOG = new THREE.Color().setRGB(0.12, 0.16, 0.3);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.2, 320);

const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0x7088c0, 0.35);
moon.position.set(-40, 80, 30);
scene.add(moon);
const sun = new THREE.DirectionalLight(0xfff0da, 3);
sun.castShadow = !LOW;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 320 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

// 3-step ramp → anime cel shading
const toonRamp = new THREE.DataTexture(new Uint8Array([105, 105, 105, 255, 185, 185, 185, 255, 255, 255, 255, 255]), 3, 1);
toonRamp.minFilter = toonRamp.magFilter = THREE.NearestFilter; toonRamp.needsUpdate = true;
const toon = (params) => new THREE.MeshToonMaterial({ gradientMap: toonRamp, ...params });

/* =====================================================================
   SKY: painted gradient, cel-shaded clouds, sun, and a sun-shower rainbow
   ===================================================================== */
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }, uSunDir: { value: SUN_DIR }, uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
    uCloudLit: { value: new THREE.Color() }, uCloudShadow: { value: new THREE.Color() }, uSun: { value: 1 }, uRainbow: { value: 0 }, uCover: { value: 0.5 },
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform float uTime, uSun, uRainbow, uCover; uniform vec3 uSunDir, uTop, uHor, uCloudLit, uCloudShadow; varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<6;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 col = mix(uHor, uTop, pow(clamp(h,0.,1.), 0.5));
      float sd = max(dot(d, uSunDir), 0.);
      col += uSun*(vec3(1.,.93,.8)*pow(sd,900.)*14. + vec3(1.,.86,.62)*pow(sd,10.)*.45);
      // rainbow opposite the sun (sun-shower)
      float ang = degrees(acos(clamp(dot(d, -uSunDir), -1., 1.)));
      float rb = smoothstep(39.6, 40.6, ang)*(1.-smoothstep(42.4, 43.4, ang));
      vec3 rbc = 0.55 + 0.45*cos(6.2831*(clamp((ang-40.)/3.4,0.,1.)*0.8 + vec3(0.67,0.33,0.0)));
      col = mix(col, col + rbc*0.6, rb*uRainbow*smoothstep(0.,.08,h));
      if (h > 0.) {
        vec2 uv = d.xz/(h+0.12)*0.75 + vec2(uTime*0.006, uTime*0.003);
        float c = fbm(uv);
        float cov = smoothstep(uCover, uCover+0.07, c);
        float lit = clamp((c - fbm(uv + uSunDir.xz*0.09))*7. + 0.55, 0., 1.);
        lit = floor(lit*3.)/2.;                                   // toon bands in the clouds
        vec3 cc = mix(uCloudShadow, uCloudLit, clamp(lit,0.,1.));
        cc += uSun*vec3(1.,.85,.6)*pow(sd,6.)*.5;                 // golden rim near the sun
        col = mix(col, cc, cov*smoothstep(0.,.12,h));
      }
      gl_FragColor = vec4(col, 1.);
    }`,
  side: THREE.BackSide, depthWrite: false, fog: false,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(280, 48, 24), skyMat);
sky.renderOrder = -1; sky.frustumCulled = false; scene.add(sky);

/* =====================================================================
   TEXTURE HELPERS (everything is generated — no image files needed)
   ===================================================================== */
function canvasTex(w, h, draw, { repeat = false, data = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  return t;
}

const NEON = ['#ff2d95', '#00e5ff', '#ffb000', '#7cff4f', '#b04dff', '#ff3b3b', '#29a3ff', '#ffe600'];
const V_WORDS = ['ラーメン', '居酒屋', 'カラオケ', 'ホテル', '寿司', '薬局', '喫茶店', '焼肉', '酒場', '東京', '夜市', '漫画', '古着', 'うどん', '雨宿り', '中華'];
const H_WORDS = ['BAR', 'RAMEN', 'コンビニ', '24H', 'CAFE', 'KARAOKE', 'HOTEL', 'SUSHI', '居酒屋', 'GAME', 'ネオン', 'NOODLE'];

function vSign(word, color, box) {
  return canvasTex(128, 512, (g, w, h) => {
    if (box) { g.fillStyle = '#f3efe4'; g.fillRect(0, 0, w, h); g.fillStyle = color; g.fillRect(0, 0, w, 18); g.fillRect(0, h - 18, w, 18); }
    else {
      g.fillStyle = '#07070c'; g.fillRect(0, 0, w, h);
      g.strokeStyle = color; g.lineWidth = 6; g.shadowColor = color; g.shadowBlur = 18; g.strokeRect(12, 12, w - 24, h - 24);
    }
    const ch = [...word], cell = Math.min(100, (h - 60) / ch.length), top = (h - cell * ch.length) / 2;
    g.font = `900 ${cell * 0.8}px ${JP}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    ch.forEach((c, i) => {
      const y = top + cell * (i + 0.5);
      if (box) { g.shadowBlur = 0; g.fillStyle = color === '#ffe600' ? '#d11' : color; g.fillText(c, w / 2, y); }
      else { g.shadowColor = color; g.shadowBlur = 24; g.fillStyle = color; g.fillText(c, w / 2, y); g.shadowBlur = 6; g.fillStyle = '#ffffffdd'; g.fillText(c, w / 2, y); }
    });
  });
}
function hSign(word, color, box) {
  return canvasTex(512, 128, (g, w, h) => {
    if (box) { g.fillStyle = color; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.fillRect(8, 8, w - 16, h - 16); }
    else { g.fillStyle = '#08080d'; g.fillRect(0, 0, w, h); g.strokeStyle = color; g.lineWidth = 5; g.shadowColor = color; g.shadowBlur = 16; g.strokeRect(10, 10, w - 20, h - 20); }
    g.font = `900 72px ${JP}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (box) { g.fillStyle = color; g.fillText(word, w / 2, h / 2 + 4); }
    else { g.shadowColor = color; g.shadowBlur = 22; g.fillStyle = color; g.fillText(word, w / 2, h / 2 + 4); g.shadowBlur = 4; g.fillStyle = '#ffffffcc'; g.fillText(word, w / 2, h / 2 + 4); }
  });
}
function shopTex(kind) {
  return canvasTex(256, 128, (g, w, h) => {
    const k = [['#eaf6ff', '#a9cbe6'], ['#ffc27a', '#7a3310'], ['#8a2aa0', '#16051f']][kind];
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, k[0]); gr.addColorStop(1, k[1]);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) { g.fillStyle = pick(NEON) + '88'; g.fillRect(rand() * w, 30 + rand() * 80, 3 + rand() * 5, 4 + rand() * 6); }
    if (kind === 0) { g.fillStyle = pick(['#1f7a3a', '#1c4fae', '#e05a1a']); g.fillRect(0, 0, w, 16); }
    if (kind === 1) for (let i = 0; i < 5; i++) { g.fillStyle = '#e02020'; g.beginPath(); g.ellipse(25 + i * 52, 22, 11, 15, 0, 0, 7); g.fill(); }
    g.fillStyle = '#0008'; for (let x = 0; x < w; x += 64) g.fillRect(x, 0, 4, h);   // window mullions
    g.fillStyle = '#0005'; for (let i = 0; i < 3; i++) g.fillRect(rand() * w, 60, 14, 68);  // people silhouettes
  });
}

// Night facade: dark walls, glowing windows
function facadeNight(o) {
  const S = 256, col = document.createElement('canvas'), emi = document.createElement('canvas');
  col.width = col.height = emi.width = emi.height = S;
  const g = col.getContext('2d'), e = emi.getContext('2d');
  g.fillStyle = o.wall; g.fillRect(0, 0, S, S); e.fillStyle = '#000'; e.fillRect(0, 0, S, S);
  for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(0,0,0,${rand() * 0.1})`; g.fillRect(rand() * S, rand() * S, rand() * 14, rand() * 50); }
  const fh = S / o.floors, cw = S / o.cols;
  for (let f = 0; f < o.floors; f++) for (let c = 0; c < o.cols; c++) {
    const x = c * cw + o.px, y = f * fh + o.py, w = cw - o.px * 2, h = fh - o.py * 2;
    if (rand() < o.lit) {
      const hue = pick(o.lights), k = rr(0.35, 1);
      g.fillStyle = hue; g.fillRect(x, y, w, h);
      e.globalAlpha = k; e.fillStyle = hue; e.fillRect(x, y, w, h); e.globalAlpha = 1;
      if (rand() < 0.45) for (let yy = y; yy < y + h * rr(0.3, 1); yy += 3) { g.fillStyle = '#0006'; g.fillRect(x, yy, w, 1); e.fillStyle = '#0008'; e.fillRect(x, yy, w, 1); }
    } else {
      g.fillStyle = o.glass; g.fillRect(x, y, w, h);
      g.fillStyle = 'rgba(140,170,220,.07)'; g.fillRect(x, y, w, h * 0.4);
    }
    g.strokeStyle = '#0008'; g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    if (o.balcony) { g.fillStyle = o.balcony; g.fillRect(c * cw + 2, y + h, cw - 4, o.py); }
  }
  const map = new THREE.CanvasTexture(col), emissiveMap = new THREE.CanvasTexture(emi);
  for (const t of [map, emissiveMap]) { t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = MAX_ANISO; }
  return new THREE.MeshStandardMaterial({ map, emissiveMap, emissive: 0xffffff, emissiveIntensity: 1.5, roughness: 0.75, metalness: 0.1 });
}

// Day facade: anime palette — pale walls, sky-blue glass with painted glare streaks, curtains, balconies
function facadeDay(o) {
  return canvasTex(256, 256, (g, S) => {
    g.fillStyle = o.wall; g.fillRect(0, 0, S, S);
    const fh = S / o.floors, cw = S / o.cols;
    for (let f = 0; f < o.floors; f++) { g.fillStyle = o.slab; g.fillRect(0, f * fh + fh - 6, S, 6); }
    g.fillStyle = 'rgba(0,0,0,.05)'; for (let c = 0; c <= o.cols; c++) g.fillRect(c * cw - 1, 0, 2, S);
    for (let f = 0; f < o.floors; f++) for (let c = 0; c < o.cols; c++) {
      const x = c * cw + o.px, y = f * fh + o.py, w = cw - o.px * 2, h = fh - o.py * 2 - 6;
      const gr = g.createLinearGradient(x, y, x + w * 0.5, y + h);
      gr.addColorStop(0, o.glassTop); gr.addColorStop(1, o.glassBot);
      g.fillStyle = gr; g.fillRect(x, y, w, h);
      g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
      const sx = x + rr(0.1, 0.9) * w;
      g.fillStyle = 'rgba(255,255,255,.55)';
      g.beginPath(); g.moveTo(sx, y); g.lineTo(sx + w * 0.22, y); g.lineTo(sx - w * 0.3 + w * 0.22, y + h); g.lineTo(sx - w * 0.3, y + h); g.fill();
      g.fillStyle = 'rgba(255,255,255,.3)';
      g.beginPath(); g.moveTo(sx + w * 0.3, y); g.lineTo(sx + w * 0.36, y); g.lineTo(sx + w * 0.06, y + h); g.lineTo(sx, y + h); g.fill();
      g.restore();
      if (rand() < 0.35) { g.fillStyle = pick(['#f4efe2', '#e9dccb', '#dfe8e4', '#f2e2e2', '#e3e6f2']); const w2 = w * rr(0.2, 0.5); g.fillRect(rand() < 0.5 ? x : x + w - w2, y, w2, h); }
      g.strokeStyle = o.frame; g.lineWidth = 2.5; g.strokeRect(x + 1, y + 1, w - 2, h - 2);
      g.fillStyle = o.frame; g.fillRect(x + w / 2 - 1, y, 2, h);
      if (o.balcony) {
        g.fillStyle = o.balcony; g.fillRect(c * cw + 3, y + h * 0.58, cw - 6, h * 0.42 + 2);
        g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(c * cw + 3, y + h * 0.58, cw - 6, 2);
        if (rand() < 0.3) { g.fillStyle = '#e4e4de'; g.fillRect(c * cw + 8, y + h * 0.7, 18, 12); g.fillStyle = '#9aa0a6'; g.beginPath(); g.arc(c * cw + 17, y + h * 0.7 + 6, 4, 0, 7); g.fill(); }
      }
    }
  }, { repeat: true });
}

/* =====================================================================
   CITY GENERATION
   ===================================================================== */
const colliders = [];      // axis-aligned boxes the player can't enter {x0,x1,z0,z1}
const lightSources = [];   // candidate positions for the pooled neon point lights (night)
const WARM = ['#ffd08a', '#ffe2b0', '#ffb870'], COOL = ['#cfe8ff', '#a8d4ff', '#e8f4ff'];
const facadeNightMats = [
  facadeNight({ wall: '#2b2e35', glass: '#0b0f16', floors: 3, cols: 4, px: 9, py: 16, lit: 0.38, lights: WARM }),
  facadeNight({ wall: '#3b2f29', glass: '#0d0d10', floors: 3, cols: 3, px: 12, py: 18, lit: 0.42, lights: WARM, balcony: '#1c1714' }),
  facadeNight({ wall: '#10151e', glass: '#0a1220', floors: 4, cols: 6, px: 3, py: 8, lit: 0.28, lights: COOL }),
  facadeNight({ wall: '#45423c', glass: '#0e0f12', floors: 3, cols: 4, px: 10, py: 14, lit: 0.34, lights: [...WARM, ...COOL], balcony: '#2a2825' }),
];
const facadeDayMats = [
  toon({ map: facadeDay({ wall: '#efebe2', slab: '#d9d2c4', glassTop: '#a5d3f5', glassBot: '#3f82c9', frame: '#5b6270', floors: 3, cols: 4, px: 9, py: 14, balcony: '#f8f6f1' }) }),
  toon({ map: facadeDay({ wall: '#dcc6a4', slab: '#c4aa86', glassTop: '#b4dcf8', glassBot: '#4a86c8', frame: '#4a4038', floors: 3, cols: 3, px: 12, py: 16 }) }),

// Box with world-scaled UVs so the window texture tiles correctly on every building size
function buildingBox(sx, sy, sz, off, T = 12) {
  const g = new THREE.BoxGeometry(sx, sy, sz), p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i) + sy / 2, z = p.getZ(i);
    if (Math.abs(n.getY(i)) > 0.5) uv.setXY(i, 0.004, 0.996);

}

  const at = (t, y, out) => O.clone().addScaledVector(dir, t).addScaledVector(N, out).setY(y);
  if (w > 3 && rand() < 0.85) {
    const k = Math.floor(rand() * 3);
    geo.shop[k].push(plane(Math.min(w * rr(0.55, 0.85), 12), 2.6, at(w / 2, 1.45, 0.05), N));
    lightSources.push({ p: at(w / 2, 2.6, 1.8), c: new THREE.Color(k === 0 ? 0xdff0ff : k === 1 ? 0xffb060 : 0xc050ff), i: 14 });

  if (w > 4 && rand() < 0.6) { const k = Math.floor(rand() * hMats.length); geo.h[k].push(plane(Math.min(w * 0.6, 5.5), 1.2, at(w / 2, 3.55, 0.1), N)); }
  if (w > 5 && h > 14 && rand() < 0.3) {   // stacked wall signs (Kabukicho style)

// Fill one side of a block with a row of buildings
function fillRow(P0, D, N, length, depth, sides) {
  const along = p => new V3().subVectors(p, P0).dot(D);
  const rowScreens = screens.filter(s => Math.abs(new V3().subVectors(s.pos, P0).dot(N)) < 0.3 && s.n.dot(N) > 0.9);
  let s = 0, first = true;
  while (s < length - 0.5) {
    let w = rr(7, 14); if (length - (s + w) < 5) w = length - s;
    let h = rand() < 0.14 ? rr(48, 85) : rr(12, 38), setback = rand() < 0.3 ? rr(0.2, 0.9) : 0, bladeCap = 99;
    for (const sc of rowScreens) {
      const a = along(sc.pos);
      if (a + sc.w / 2 > s && a - sc.w / 2 < s + w) { h = Math.max(h, sc.pos.y + sc.h / 2 + 5); setback = 0; bladeCap = sc.pos.y - sc.h / 2 - 0.5; }
    }
    const d = depth - setback, style = Math.floor(rand() * facadeNightMats.length);
    const front = P0.clone().addScaledVector(D, s).addScaledVector(N, -setback);
    const center = P0.clone().addScaledVector(D, s + w / 2).addScaledVector(N, -(setback + d / 2));
    const alongX = Math.abs(D.x) > 0.5, sx = alongX ? w : d, sz = alongX ? d : w;
    const g = buildingBox(sx, h, sz, rand() * 12); g.translate(center.x, h / 2, center.z); geo.build[style].push(g);

    // roof clutter + aviation lights
    for (let i = 0, n = Math.floor(rand() * 4); i < n; i++) {
      const b = new THREE.BoxGeometry(rr(1, 3), rr(0.8, 2.2), rr(1, 3));
      b.translate(center.x + rr(-sx, sx) * 0.35, h + 0.6, center.z + rr(-sz, sz) * 0.35); geo.roof.push(b);
    }
    if (h > 45) for (const sgn of [-1, 1]) { const a = new THREE.SphereGeometry(0.35, 8, 6); a.translate(center.x + sgn * sx * 0.4, h + 0.4, center.z + sgn * sz * 0.4); geo.avi.push(a); }

    decorate(front, D, N, w, h, bladeCap);
    if (sides && first) decorate(front.clone(), N.clone().negate(), D.clone().negate(), d, h);   // exposed side facing cross street
    s += w; first = false;
    if (sides && s >= length - 0.5) decorate(front.clone().addScaledVector(D, w).addScaledVector(N, -d), N.clone(), D.clone(), d, h);
  }
}

function drawScreen(g, W, H, t, v) {
  const hue = (t * 22 + v * 140) % 360;
  const gr = g.createLinearGradient(0, 0, W, H);
  gr.addColorStop(0, `hsl(${hue},85%,34%)`); gr.addColorStop(1, `hsl(${(hue + 70) % 360},90%,10%)`);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const tt = t + v * 3, phase = Math.floor(tt / 6) % 3, lt = (tt % 6) / 6;
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.shadowColor = '#fff';
  if (phase === 0) { g.shadowBlur = 30; g.font = `900 ${170 * (1 + 0.05 * Math.sin(t * 3))}px ${JP}`; g.fillText('雨', W / 2, H * 0.44); }
  else if (phase === 1) {
    g.shadowBlur = 20; g.font = `900 112px Inter, Arial Black, sans-serif`; g.fillText('TOKYO', W / 2 + (0.5 - lt) * 90, H * 0.4);
    g.font = `700 36px ${JP}`; g.shadowBlur = 8; g.fillText('東京・ナイトシティ', W / 2, H * 0.7);
  } else {
    for (let i = 0; i < 24; i++) {
      const bh = (0.55 + 0.45 * Math.sin(t * 6 + i * 0.7) * Math.sin(t * 2.3 + i)) * H * 0.62;
      g.fillStyle = `hsl(${(hue + i * 9) % 360},100%,66%)`; g.fillRect(i * W / 24 + 3, H * 0.84 - bh, W / 24 - 6, bh);
    }
  }
  g.restore();
  g.fillStyle = '#0009'; g.fillRect(0, H - 40, W, 40);
  g.font = `700 22px ${JP}`; g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillStyle = '#ffe66b';
  const msg = '  ◆ 本日は雨  RAIN ALL DAY  ◆ 東京へようこそ  WELCOME TO TOKYO  ◆ 渋谷 → 新宿  ';
  const mw = g.measureText(msg).width, off = -((t * 90) % mw);
  g.fillText(msg, off, H - 20); g.fillText(msg, off + mw, H - 20);
  g.fillStyle = '#0003'; for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
  return hue;
}

const groundTex = (() => {
  const PX = 6, W = (W_MAX - W_MIN) * PX, H = (Z_MAX - Z_MIN) * PX;
  const X = x => (x - W_MIN) * PX, Z = z => (z - Z_MIN) * PX, M = m => m * PX;
  return canvasTex(W, H, g => {
    g.fillStyle = '#5c6068'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 50000; i++) { const v = (rand() * 40) | 0; g.fillStyle = `rgba(${v + 70},${v + 72},${v + 80},.5)`; g.fillRect(rand() * W, rand() * H, 2, 2); }
    const walks = [[W_MIN, W_MAX, Z_MIN, Z_MIN + WALK], [W_MIN, W_MAX, Z_MAX - WALK, Z_MAX], [W_MIN, W_MIN + WALK, Z_MIN, Z_MAX], [W_MAX - WALK, W_MAX, Z_MIN, Z_MAX],
      ...innerBlocks.map(b => [b.x0 - WALK, b.x1 + WALK, b.z0 - WALK, b.z1 + WALK])];
    for (const [x0, x1, z0, z1] of walks) {
      g.fillStyle = '#a4a19b'; g.fillRect(X(x0), Z(z0), M(x1 - x0), M(z1 - z0));
      g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1; g.beginPath();
      for (let x = Math.ceil(x0); x < x1; x++) { g.moveTo(X(x), Z(z0)); g.lineTo(X(x), Z(z1)); }
      for (let z = Math.ceil(z0); z < z1; z++) { g.moveTo(X(x0), Z(z)); g.lineTo(X(x1), Z(z)); }
      g.stroke();
      g.strokeStyle = '#d8d6d0'; g.lineWidth = 5; g.strokeRect(X(x0) + 2.5, Z(z0) + 2.5, M(x1 - x0) - 5, M(z1 - z0) - 5);
    }
    g.fillStyle = 'rgba(245,245,238,.95)';
    for (const a of AVES) for (let i = 0; i < CROSS.length - 1; i++) for (let z = CROSS[i] + ROAD + 6; z < CROSS[i + 1] - ROAD - 8; z += 6) g.fillRect(X(a) - M(0.08), Z(z), M(0.16), M(3));
    for (const c of CROSS) for (let i = 0; i < AVES.length - 1; i++) for (let x = AVES[i] + ROAD + 6; x < AVES[i + 1] - ROAD - 8; x += 6) g.fillRect(X(x), Z(c) - M(0.08), M(3), M(0.16));
    for (const a of AVES) for (const c of CROSS) for (const s of [-1, 1]) {
      if (!(s < 0 && c === CROSS[0]) && !(s > 0 && c === CROSS.at(-1))) {           // zebra across avenue
        const z0 = c + s * (ROAD + 0.8), z1 = c + s * (ROAD + 3.8);
        for (let x = a - ROAD + 0.6; x < a + ROAD - 0.4; x += 1) g.fillRect(X(x), Z(Math.min(z0, z1)), M(0.5), M(3));
        g.fillRect(X(s > 0 ? a : a - ROAD), Z(c + s * (ROAD + 5)) - M(0.2), M(ROAD), M(0.4));   // stop line
        g.save(); g.translate(X(a + (s > 0 ? -3.5 : 3.5)), Z(c + s * (ROAD + 8.5))); if (s < 0) g.rotate(Math.PI);
        g.scale(1, 2.2); g.font = `900 ${M(1.3)}px ${JP}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('止まれ', 0, 0); g.restore();
      }
      if (!(s < 0 && a === AVES[0]) && !(s > 0 && a === AVES.at(-1))) {             // zebra across cross street

      }
    }
  });
})();

function collide(p, r) {

    const cx = clamp(p.x, b.x0, b.x1), cz = clamp(p.z, b.z0, b.z1);
    const dx = p.x - cx, dzv = p.z - cz, d2 = dx * dx + dzv * dzv;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dzv / d * r; }
    else {
      const pen = [p.x - b.x0, b.x1 - p.x, p.z - b.z0, b.z1 - p.z], m = Math.min(...pen);
      if (m === pen[0]) p.x = b.x0 - r; else if (m === pen[1]) p.x = b.x1 + r; else if (m === pen[2]) p.z = b.z0 - r; else p.z = b.z1 + r;

}

    const white = noiseBuffer(4, false);
    const layer = (type, freq, q, gain) => {
      const s = actx.createBufferSource(); s.buffer = white; s.loop = true;
      const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = actx.createGain(); g.gain.value = gain; s.connect(f).connect(g).connect(master); s.start(0, Math.random() * 3);
    };
    layer('lowpass', 900, 0.4, 0.35); layer('bandpass', 2500, 0.6, 0.16); layer('highpass', 7000, 0.3, 0.05);
  } catch (e) { actx = null; }
}

  if (!actx) return;

  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(900 - dist * 250, t); f.frequency.exponentialRampToValueAtTime(120, t + 4);

}

      day = mix(day, day*vec3(1.04,1.0,0.95), smoothstep(0.5,1.,l));        // warm highlights
      day = mix(day, day*vec3(0.9,0.97,1.08), 1.-smoothstep(0.,0.5,l));     // cool shadows
      c = mix(night, day, uDay);
      c += (h(vUv*1000.+fract(uTime)*100.)-.5)*mix(0.045, 0.018, uDay);
      c += uFlash*vec3(.25,.28,.35);
      gl_FragColor = vec4(c,1.);
    }`,
});
composer.addPass(grade);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  for (const rt of [composer.renderTarget1, composer.renderTarget2]) {
    rt.depthTexture.dispose(); rt.depthTexture = makeDepthRT(rt.width, rt.height);
  }
  ink.uniforms.uTexel.value.set(1 / innerWidth, 1 / innerHeight); ink.uniforms.uAspect.value = innerWidth / innerHeight;
});

/* =====================================================================
   DAY ⇄ NIGHT
   ===================================================================== */
const MODES = {
  day: {
    exposure: 1.0, fog: lin(0.46, 0.64, 0.86), density: 0.0075, top: lin(0.035, 0.2, 0.7),
    cloudLit: lin(1.0, 0.98, 0.95), cloudShadow: lin(0.5, 0.58, 0.76), sun: 1, rainbow: 0.55, cover: 0.5,
    hemi: [0xbfdcff, 0x6d6457, 1.7], sunI: 3.2, moonI: 0, keyI: 0, bloom: [0.45, 0.5, 0.92], mirror: 0x8a929d, ground: 1,
    signBox: 1.0, signNeon: 1.25, shop: 1.0, screen: 1.1, lampHead: 0.9, rainCol: lin(0.8, 0.86, 0.95), rainA: 0.42, rainAdd: false,
    outline: 1, line: lin(0.03, 0.045, 0.1), wire: 0x2a3140,
  },
  night: {
    exposure: 1.15, fog: new THREE.Color(0x0a1020), density: 0.021, top: lin(0.003, 0.004, 0.012),
    cloudLit: lin(0.035, 0.03, 0.06), cloudShadow: lin(0.008, 0.01, 0.02), sun: 0, rainbow: 0, cover: 0.45,
    hemi: [0x5266a0, 0x14141c, 1.25], sunI: 0, moonI: 0.35, keyI: 5, bloom: [0.85, 0.65, 0.8], mirror: 0x646a76, ground: 0.1,
    signBox: 1.15, signNeon: 2.4, shop: 1.15, screen: 1.6, lampHead: 3, rainCol: lin(0.55, 0.65, 0.82), rainA: 0.5, rainAdd: true,
    outline: 0.35, line: lin(0.0, 0.0, 0.0), wire: 0x06080c,
  },
};
let isDay = true;
function applyMode() {
  const M = isDay ? MODES.day : MODES.night;
  renderer.toneMappingExposure = M.exposure;
  baseFog.copy(M.fog); scene.fog.color.copy(M.fog); scene.fog.density = M.density;
  const u = skyMat.uniforms;
  u.uTop.value.copy(M.top); u.uHor.value.copy(M.fog); u.uCloudLit.value.copy(M.cloudLit); u.uCloudShadow.value.copy(M.cloudShadow);
  u.uSun.value = M.sun; u.uRainbow.value = M.rainbow; u.uCover.value = M.cover;
  hemi.color.set(M.hemi[0]); hemi.groundColor.set(M.hemi[1]); hemi.intensity = M.hemi[2];
  sun.intensity = M.sunI; moon.intensity = M.moonI; keyLight.intensity = M.keyI;
  [bloom.strength, bloom.radius, bloom.threshold] = M.bloom;
  mirror.material.uniforms.color.value.set(M.mirror);
  ground.material.color.setScalar(M.ground);
  buildingMeshes.forEach((m, i) => { m.material = isDay ? facadeDayMats[i] : facadeNightMats[i]; });
  roofMesh.material = isDay ? roofDayMat : roofNightMat;
  vmMesh.material = isDay ? vmDayMat : vmNightMat;
  poleMesh.material = isDay ? poleDayMat : poleNightMat;
  for (const c of charMeshes) c.mesh.material = isDay ? c.day : c.night;
  for (const m of [...vMats, ...hMats]) m.color.setScalar(m.userData.box ? M.signBox : M.signNeon);
  shopMats.forEach(m => m.color.setScalar(M.shop)); vmFrontMat.color.setScalar(M.shop);
  screenMats.forEach(m => m.color.setScalar(M.screen));
  lampHeadMat.color.setRGB(M.lampHead, M.lampHead * 0.87, M.lampHead * 0.67);
  coneMesh.visible = !isDay; aviMesh.visible = !isDay; wireMat.color.set(M.wire);
  rainMat.uniforms.uColor.value.copy(M.rainCol); rainMat.uniforms.uAlpha.value = M.rainA;
  rainMat.blending = M.rainAdd ? THREE.AdditiveBlending : THREE.NormalBlending; rainMat.needsUpdate = true;
  ink.uniforms.uOutline.value = M.outline; ink.uniforms.uLineColor.value.copy(M.line);
  grade.uniforms.uDay.value = isDay ? 1 : 0;
  if (isDay) for (const l of pool) { l.userData.src = null; l.intensity = 0; }
  modeBtn.textContent = isDay ? '☾ NIGHT' : '☀ DAY';
}
const modeBtn = document.getElementById('mode');
const fadeEl = document.getElementById('fade');
function toggleMode() {
  fadeEl.style.background = isDay ? '#05070d' : '#ffffff';
  fadeEl.classList.add('on');
  setTimeout(() => { isDay = !isDay; applyMode(); fadeEl.classList.remove('on'); }, 350);
}
modeBtn.onclick = toggleMode;
applyMode();

/* =====================================================================
   UI
   ===================================================================== */
const statusEl = document.getElementById('status'), enterBtn = document.getElementById('enter');
function status(t) { statusEl.textContent = t; }
document.getElementById('hints').innerHTML = IS_TOUCH
  ? 'LEFT THUMB — drag to walk (push far to run)<br>RIGHT THUMB — swipe to look around'
  : 'WASD / ARROWS — walk · SHIFT — run · N — day / night<br>CLICK, then MOVE MOUSE — look (Esc frees cursor) · Q / E — turn view · SCROLL — zoom · GAMEPAD';
document.getElementById('help').textContent = IS_TOUCH ? 'LEFT: MOVE · RIGHT: LOOK' : 'CLICK + MOVE MOUSE TO LOOK · Q/E TURN · WASD MOVE · SHIFT RUN';
let started = false;
enterBtn.onclick = () => {
  started = true;
  document.getElementById('intro').classList.add('hide');
  document.getElementById('snd').style.display = 'block';
  document.getElementById('help').classList.add('show');
  setTimeout(() => document.getElementById('help').classList.remove('show'), 9000);
  startAudio(); canvas.focus();
  if (IS_TOUCH && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
};
status('Loading character…');
charReady.then(() => { status(''); enterBtn.disabled = false; });

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
window.__app = { THREE, scene, camera, renderer, composer, player, cam, mirror, ground, toggleMode };   // handy for debugging in DevTools
const clock = new THREE.Clock();
const camTarget = player.pos.clone().add(new V3(0, 1.45, 0));
const desired = new V3(), tmp = new V3(), sunProj = new V3(), camFwd = new V3();
camera.position.set(player.pos.x, 3, player.pos.z + 6);
let poolTimer = 0, nextBolt = 7, flash = 0, flicker = 0, frame = 0, sunVis = 0;

function update(dt, t) {
  // ---- movement ----
  const inp = started ? readInput(dt) : { x: 0, y: 0, run: false, analog: false };
  const mag = Math.min(1, Math.hypot(inp.x, inp.y));
  const fwd = tmp.set(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
  const dirX = fwd.x * inp.y + Math.cos(cam.yaw) * inp.x, dirZ = fwd.z * inp.y - Math.sin(cam.yaw) * inp.x;
  const moving = mag > 0.08;
  const target = moving ? (inp.run ? RUN_SPEED : WALK_SPEED) * (inp.analog && !inp.run ? clamp(mag * 1.25, 0.4, 1) : 1) : 0;
  player.speed = damp(player.speed, target, moving ? 6 : 10, dt);
  if (moving) player.heading = lerpAngle(player.heading, Math.atan2(dirX, dirZ), 1 - Math.exp(-dt * 10));
  player.pos.x += Math.sin(player.heading) * player.speed * dt;
  player.pos.z += Math.cos(player.heading) * player.speed * dt;
  collide(player.pos, 0.35);
  charRoot.position.copy(player.pos); charRoot.rotation.y = player.heading;

  // camera swings behind the player while walking (forward or sideways) unless the player is steering the view
  if (moving && inp.y > -0.3 && now - cam.lastLook > 0.8) {
    const rate = 2.2 * Math.max(0, inp.y / mag) + 0.9 * Math.abs(inp.x / mag);
    cam.yaw = lerpAngle(cam.yaw, player.heading + Math.PI, 1 - Math.exp(-dt * rate));
  }
  if (!started) cam.yaw = Math.sin(t * 0.08) * 0.35;

  // ---- animation blending ----
  const s = player.speed;
  const tw = s < 0.1 ? { idle: 1, walk: 0, run: 0 } : s <= WALK_SPEED
    ? { idle: 1 - s / WALK_SPEED, walk: s / WALK_SPEED, run: 0 }
    : { idle: 0, walk: 1 - (s - WALK_SPEED) / (RUN_SPEED - WALK_SPEED), run: (s - WALK_SPEED) / (RUN_SPEED - WALK_SPEED) };
  if (mixer) {
    for (const k in actions) { weights[k] = damp(weights[k], tw[k], 10, dt); actions[k].setEffectiveWeight(weights[k]); }
    if (actions.walk) actions.walk.timeScale = clamp(s / WALK_SPEED, 0.6, 1.4);
    if (actions.run) actions.run.timeScale = clamp(s / RUN_SPEED, 0.7, 1.2);
    mixer.update(dt);
  } else if (fallback) {
    fallback.t += dt * (2 + s * 2.2); const sw = Math.sin(fallback.t) * Math.min(1, s / 2) * 0.7;
    fallback.legs[0].rotation.x = sw; fallback.legs[1].rotation.x = -sw; fallback.arms[0].rotation.x = -sw; fallback.arms[1].rotation.x = sw;
  }

  // ---- camera ----
  camTarget.lerp(tmp.copy(player.pos).setY(1.45), 1 - Math.exp(-dt * 10));
  const cp = Math.cos(cam.pitch);
  desired.set(camTarget.x + Math.sin(cam.yaw) * cp * cam.dist, camTarget.y + Math.sin(cam.pitch) * cam.dist, camTarget.z + Math.cos(cam.yaw) * cp * cam.dist);
  desired.y += Math.sin(t * 1.3) * 0.04 + Math.abs(Math.sin(t * 5.5)) * Math.min(1, s / 4) * 0.05;   // handheld sway + footstep bob
  collide(desired, 0.3); desired.y = Math.max(0.35, desired.y);
  camera.position.lerp(desired, 1 - Math.exp(-dt * 12));
  camera.lookAt(camTarget);
  keyLight.position.copy(player.pos).lerp(camera.position, 0.35).setY(2.8);
  sky.position.copy(camera.position);

  // ---- sun, shadows, lens flare ----
  sun.position.copy(player.pos).addScaledVector(SUN_DIR, 150); sun.target.position.copy(player.pos);
  if (renderer.shadowMap.enabled) renderer.shadowMap.needsUpdate = isDay;
  sunProj.copy(camera.position).addScaledVector(SUN_DIR, 250).project(camera);
  const facing = camera.getWorldDirection(camFwd).dot(SUN_DIR) > 0.2;
  sunVis = damp(sunVis, isDay && facing && Math.abs(sunProj.x) < 1.2 && Math.abs(sunProj.y) < 1.2 ? 1 : 0, 6, dt);
  ink.uniforms.uSunUV.value.set(sunProj.x * 0.5 + 0.5, sunProj.y * 0.5 + 0.5); ink.uniforms.uSunVis.value = sunVis;
  skyMat.uniforms.uTime.value = t;

  // ---- rain, ripples ----
  rainMat.uniforms.uTime.value = t % 1000; rainMat.uniforms.uCenter.value.copy(camera.position);
  ripMat.uniforms.uTime.value = t; ripMat.uniforms.uCenter.value.copy(player.pos);

  // ---- neon light pool (night only) ----
  if (!isDay) {
    if ((poolTimer -= dt) <= 0) { poolTimer = 0.25; updatePool(player.pos); }
    for (const l of pool) { const src = l.userData.src; if (src) l.color.copy(src.c); l.intensity = damp(l.intensity, src ? src.i : 0, 4, dt); }
  }

  // ---- video screens (redraw every other frame) ----
  if (frame++ % 2 === 0) screenCanvases.forEach((c, v) => {
    const hue = drawScreen(c.getContext('2d'), c.width, c.height, t, v); screenTex[v].needsUpdate = true;
    for (const sl of screenLights) if (sl.v === v) sl.c.setHSL(hue / 360, 0.85, 0.55);
  });

  // ---- flickering neon + blinking aviation lights ----
  flicker -= dt; if (flicker < -rr(2, 6)) flicker = rr(0.2, 0.6);
  if (!isDay) vMats[3].color.setScalar(flicker > 0 && Math.random() < 0.5 ? 0.15 : MODES.night.signNeon);
  aviMat.color.setRGB(Math.sin(t * 3) > 0.3 ? 4 : 0.15, 0, 0);

  // ---- lightning (night storm) ----
  if (!isDay && t > nextBolt) {
    nextBolt = t + rr(9, 22); flash = 1;
    const dist = Math.random(); setTimeout(() => thunder(dist), 500 + dist * 2200);
  }
  flash = Math.max(0, flash - dt * 2.2);
  const f = flash > 0 ? flash * (0.55 + 0.45 * Math.sin(t * 70)) * (flash > 0.55 || flash < 0.35 ? 1 : 0.25) : 0;
  const M = isDay ? MODES.day : MODES.night;
  hemi.intensity = M.hemi[2] + f * 7; moon.intensity = M.moonI + f * 5;
  scene.fog.color.copy(baseFog).lerp(FLASH_FOG, f * 0.7); skyMat.uniforms.uHor.value.copy(scene.fog.color);
  rainMat.uniforms.uFlash.value = f * 0.6; grade.uniforms.uFlash.value = f * 0.4; grade.uniforms.uTime.value = t;
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  now = clock.elapsedTime;
  update(dt, now);
  composer.render();
});
</script>
</body>
</html>
